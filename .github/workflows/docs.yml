name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for GitHub Pages deployments via Actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment runs at a time; if a new push arrives, cancel the
# in-flight run and start fresh so the deployed site is always up to date.
concurrency:
  group: pages
  cancel-in-progress: true

# Build and deploy are separate jobs, like GitHub's own Pages workflow. When
# deploy-pages runs straight after the upload in the same job, it sometimes
# can't find the artifact yet (actions/deploy-pages#451). Separate jobs also
# mean "Re-run failed jobs" redeploys the same artifact instead of uploading
# a second one, which deploy-pages also rejects.
jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux platform binaries
        if: runner.os == 'Linux'
        run: |
          npm install --no-save \
            @esbuild/linux-x64@$(node -p "require('./node_modules/esbuild/package.json').version") \
            @rollup/rollup-linux-x64-gnu@$(node -p "require('./node_modules/rollup/package.json').version")

      # Build packages first — docs/src imports from the klods workspace.
      - name: Build klods-css
        run: npm run build --workspace packages/klods-css

      - name: Build klods-js
        run: npm run build --workspace packages/klods-js

      - name: Build docs
        run: npm run build --workspace apps/docs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
