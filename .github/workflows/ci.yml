name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Lint, test & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Linux platform binaries
        if: runner.os == 'Linux'
        run: |
          npm install --no-save \
            @esbuild/linux-x64@$(node -p "require('./node_modules/esbuild/package.json').version") \
            @rollup/rollup-linux-x64-gnu@$(node -p "require('./node_modules/rollup/package.json').version")

      - name: Lint
        run: npm run lint:check

      - name: Check formatting
        run: npm run format:check

      - name: Check package lint
        run: npm run package:lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  a11y:
    name: Accessibility audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Linux platform binaries
        if: runner.os == 'Linux'
        run: |
          npm install --no-save \
            @esbuild/linux-x64@$(node -p "require('./node_modules/esbuild/package.json').version") \
            @rollup/rollup-linux-x64-gnu@$(node -p "require('./node_modules/rollup/package.json').version")

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: apps/docs

      - name: Build
        run: npm run build

      - name: Accessibility audit
        run: npm run test:a11y
        working-directory: apps/docs

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-a11y-report
          path: apps/docs/playwright-report-a11y/
          retention-days: 7

  npm-audit:
    name: Audit dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Linux platform binaries
        if: runner.os == 'Linux'
        run: |
          npm install --no-save \
            @esbuild/linux-x64@$(node -p "require('./node_modules/esbuild/package.json').version") \
            @rollup/rollup-linux-x64-gnu@$(node -p "require('./node_modules/rollup/package.json').version")

      - name: Audit dependencies
        run: npm audit --audit-level=high
